plugins {
    id 'com.android.library'
    id 'com.jfrog.artifactory'
    id 'maven-publish'
}

//==================================================================================================
// PROJECT
//==================================================================================================
def version_name = project.version
version = version_name

//==================================================================================================
// ANDROID
//==================================================================================================

android {
    compileSdk = android_api
    defaultConfig {
        minSdkVersion min_android_api
        targetSdkVersion android_api
        versionCode buildNumber ? buildNumber : 1
        versionName version_name
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled System.getenv("CI") ? true : false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'lite.sdk.pro'
            buildConfigField "String", "OMIDPV", "\"$omid_version\""
            buildConfigField "String", "OMIDPN", "\"Pubnativenet\""
            buildConfigField "String", "HVER", "\"$version_name\""
            buildConfigField "String", "SDK_VERSION", "\"$version_name\""
            buildConfigField "String", "SDK_WRAPPER_VERSION", "\"$version_name\""
            buildConfigField "String", "SDK_WRAPPER_PACKAGE", "\"\""
            buildConfigField "String", "DISPLAY_MANAGER_NAME", "\"HyBid\""
            buildConfigField "Boolean", "IS_WRAPPED", "false"
            buildConfigField "String", "BASE_URL", "\"https://api.pubnative.net/\""
            buildConfigField "String", "BASE_RTB_URL", "\"https://dsp.pubnative.net/\""
        }
        debug {
            buildConfigField "String", "OMIDPV", "\"$omid_version\""
            buildConfigField "String", "OMIDPN", "\"Pubnativenet\""
            buildConfigField "String", "HVER", "\"$version_name\""
            buildConfigField "String", "SDK_VERSION", "\"$version_name\""
            buildConfigField "String", "SDK_WRAPPER_VERSION", "\"$version_name\""
            buildConfigField "String", "SDK_WRAPPER_PACKAGE", "\"\""
            buildConfigField "String", "DISPLAY_MANAGER_NAME", "\"HyBid\""
            buildConfigField "Boolean", "IS_WRAPPED", "false"
            buildConfigField "String", "BASE_URL", "\"https://api.pubnative.net/\""
            buildConfigField "String", "BASE_RTB_URL", "\"https://dsp.pubnative.net/\""
            enableUnitTestCoverage true
            enableAndroidTestCoverage true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    namespace 'net.pubnative.lite.sdk'
}

// Helper method to update specific files
def updateFileWithReplacements(String filePath, Map<String, String> replacements) {
    def targetFile = file(filePath)
    if (targetFile.exists()) {
        def content = targetFile.text
        replacements.each { oldValue, newValue ->
            content = content.replace(oldValue, newValue)
        }
        targetFile.text = content
    } else {
        println "${filePath} file not found at: ${targetFile.path}"
    }
}

tasks.register('repackageNG') {
    doLast {
        def ngJavaDir = file("src/nextgen/java/com/smaato/sdk/ng")
        def ngResDir = file("src/nextgen/res")
        def ngManifestDir = file("src/nextgen")

        ngJavaDir.mkdirs()
        ngResDir.mkdirs()
        def sourceDir = file("src/main/java/net/pubnative/lite/sdk")
        if (sourceDir.exists()) {
            // 1. Copy and transform Java files
            fileTree(dir: sourceDir).include("**/*.java").exclude("**/HyBidViewabilityManager.java").each { File file ->
                def content = file.text
                def newFileName = file.name
                if (content =~ /(class|interface|enum)\s+Hy[Bb]id(\w*)/) {
                    // Rename class/interface/enum declaration (handles both 'HyBid' and 'Hybid')
                    content = content.replaceAll(/(class|interface|enum)\s+Hy[Bb]id(\w*)/, { m, type, suffix ->
                        "${type} NextGen${suffix}"
                    })
                    // Rename filename
                    newFileName = newFileName.replaceAll(/HyBid|Hybid/, "NextGen")
                }
                // Handle PN* class renaming
                if (content.contains("PN")) {
                    if (content =~ /(class|interface|enum)\s+PN([A-Z]\w*)/) {
                        content = content.replaceAll(/(class|interface|enum)\s+PN([A-Z]\w*)/, { m, type, suffix ->
                            "${type} NGSDK${suffix}"
                        })
                        newFileName = newFileName.replaceAll(/^PN/, "NGSDK")
                    }
                }

                //Remove Licence Header for all Java classes
                content = content.replaceAll("(?m)^\\s*// https://github\\.com/pubnative/pubnative-hybid-android-sdk/blob/main/LICENSE\\s*\\r?\\n", "")

                // Replace package name and import statement
                content = content.replaceAll("package net.pubnative.lite.sdk", "package com.smaato.sdk.ng")
                content = content.replaceAll("import net.pubnative.lite.sdk", "import com.smaato.sdk.ng")
                content = content.replaceAll("import static net.pubnative.lite.sdk", "import static com.smaato.sdk.ng")
                content = content.replaceAll("net.pubnative.lite.sdk.BuildConfig", "com.smaato.sdk.ng.BuildConfig")

                //Replace all PN* references
                if (content.contains("PN")) {
                    content = content.replaceAll(/\bPN([A-Z]\w*)/, 'NGSDK$1')
                }

                // Replace HYBID with NEXTGEN
                content = content.replaceAll(~/HYBID/, 'NEXTGEN')

                // Replace hybid with nextgen
                content = content.replaceAll(~/hybid/, 'nextgen')

                // Replace HyBid, Hybid, hyBid with NextGen
                content = content.replaceAll(~/HyBid/, 'NextGen')
                content = content.replaceAll(~/Hybid/, 'NextGen')
                content = content.replaceAll(~/hyBid/, 'NextGen')

                // Replace vrvsdk_ resource prefix with ngsdk_ to avoid resource collision
                // when both HyBid SDK and NG SDK are present in the same app
                content = content.replaceAll(/R\.layout\.vrvsdk_/, 'R.layout.ngsdk_')
                content = content.replaceAll(/R\.drawable\.vrvsdk_/, 'R.drawable.ngsdk_')
                content = content.replaceAll(/R\.id\.vrvsdk_/, 'R.id.ngsdk_')
                content = content.replaceAll(/R\.string\.vrvsdk_/, 'R.string.ngsdk_')
                content = content.replaceAll(/R\.dimen\.vrvsdk_/, 'R.dimen.ngsdk_')
                content = content.replaceAll(/R\.color\.vrvsdk_/, 'R.color.ngsdk_')
                content = content.replaceAll(/R\.style\.vrvsdk_/, 'R.style.ngsdk_')
                content = content.replaceAll(/R\.mipmap\.vrvsdk_/, 'R.mipmap.ngsdk_')

                // Write the modified content back to the file
                def relativePath = file.parentFile.path.substring(sourceDir.path.length())
                def targetFile = new File(ngJavaDir, relativePath + "/" + newFileName)
                targetFile.parentFile.mkdirs()
                targetFile.text = content
            }

            //Removes NextGenViewabilityManager and its usage from NextGen.java (namespaced of HyBidViewabilityManager and HyBid.java)
            def nextGenFile = file('src/nextgen/java/com/smaato/sdk/ng/NextGen.java')
            if (nextGenFile.exists()) {
                def nextgenContent = nextGenFile.text

                // Remove the import statement for NextGenViewabilityManager
                nextgenContent = nextgenContent.replaceAll(/(?m)^import com\.smaato\.sdk\.ng\.viewability\.NextGenViewabilityManager;\r?\n/, '')

                // Remove NextGenViewabilityManager instance creation code block
                nextgenContent = nextgenContent.replaceAll(/(?ms)\s*if \(hasPackageName\("net\.pubnative\.lite\.sdk"\)\) \{\s*sSdkManager = SdkManager\.builder\(\).*?\.visibilityManager\(new NextGenViewabilityManager\(application\)\).*?\.build\(\);\s*}/, '')

                nextGenFile.text = nextgenContent
            } else {
                println "NextGen.java file not found at: ${nextGenFile.path}"
            }

            //Update UserAgentProvider
            updateFileWithReplacements('src/nextgen/java/com/smaato/sdk/ng/UserAgentProvider.java', [
                "net.pubnative.lite.useragent": "com.smaato.sdk.ng.useragent"
            ])

            //Update UserDataManager
            updateFileWithReplacements('src/nextgen/java/com/smaato/sdk/ng/UserDataManager.java', [
                "net.pubnative.lite.dataconsent": "com.smaato.sdk.ng.dataconsent",
                "https://pubnative.net/privacy-notice/": "https://www.smaato.com/privacy/"
            ])

            //Update VgiIdManager
            updateFileWithReplacements('src/nextgen/java/com/smaato/sdk/ng/VgiIdManager.java', [
                "net.pubnative.lite.vgiid": "com.smaato.sdk.ng.vgiid"
            ])

            //Update DiagnosticsManager
            updateFileWithReplacements('src/nextgen/java/com/smaato/sdk/ng/DiagnosticsManager.java', [
                "net.pubnative.nextgen.adapters": "com.smaato.sdk.adapters",
                "net.pubnative.lite.adapters": "com.smaato.sdk.adapters"
            ])

            //Update NextGenInterstitialBroadcastReceiver
            updateFileWithReplacements('src/nextgen/java/com/smaato/sdk/ng/interstitial/NextGenInterstitialBroadcastReceiver.java', [
                "net.pubnative.nextgen.interstitial": "com.smaato.sdk.ng.interstitial"
            ])

            //Update NextGenRewardedBroadcastReceiver
            updateFileWithReplacements('src/nextgen/java/com/smaato/sdk/ng/rewarded/NextGenRewardedBroadcastReceiver.java', [
                "net.pubnative.nextgen.rewarded": "com.smaato.sdk.ng.rewarded"
            ])

            //Update Ad
            updateFileWithReplacements('src/nextgen/java/com/smaato/sdk/ng/models/Ad.java', [
                "got.pubnative.net": "got.track.smaato.net",
                "https://pubnative.net/content-info": "https://www.smaato.com/privacy/",
                "https://cdn.pubnative.net/static/adserver/contentinfo.png":"https://cdn.verve.com/logos/verve_contentinfo_new.png"
            ])

            //Update VideoAdControllerVpaid BASE_URL
            updateFileWithReplacements('src/nextgen/java/com/smaato/sdk/ng/vpaid/VideoAdControllerVpaid.java', [
                "http://pubnative.net": "https://verve.com",
            ])

            // 2. Copy resources
            def mainResDir = file("src/main/res")
            if (mainResDir.exists()) {
                copy {
                    from mainResDir
                    into ngResDir
                    // Rename vrvsdk_ prefix to ngsdk_ for all resource files
                    rename { fileName ->
                        fileName.replace('vrvsdk_', 'ngsdk_')
                    }
                }
            }

            // 3. Copy AndroidManifest.xml
            def mainManifest = file("src/main/AndroidManifest.xml")
            if (mainManifest.exists()) {
                def manifestContent = mainManifest.text
                def ngManifest = new File(ngManifestDir, "AndroidManifest.xml")
                ngManifest.text = manifestContent
            }

            // 4. Copy assets
            def mainAssetsDir = file("src/main/assets")
            if (mainAssetsDir.exists()) {
                def ngAssetsDir = file("src/nextgen/assets")
                copy {
                    from mainAssetsDir
                    into ngAssetsDir
                }
            }
        } else {
            println "Source directory not found: ${sourceDir.path}"
        }
    }
}

