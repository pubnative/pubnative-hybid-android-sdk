//--------------------------------------------------------------------------------------------------
// sonar
//--------------------------------------------------------------------------------------------------
apply plugin: 'jacoco'

jacoco {
    toolVersion = "0.8.11"
}

tasks.register("jacocoTestReport", JacocoReport) {
    group = "verification"
    description = "Generates JaCoCo coverage report for hybid.sdk"

    dependsOn "testDebugUnitTest"

    reports {
        xml.required = true
        html.required = true
    }

    def fileFilter = ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*']
    def debugTree = layout.buildDirectory.dir("intermediates/javac/debug")
    def kotlinDebugTree = layout.buildDirectory.dir("tmp/kotlin-classes/debug")

    sourceDirectories.setFrom(files([
            "$projectDir/src/main/java",
            "$projectDir/src/main/kotlin"
    ]))

    classDirectories.setFrom(files([
        fileTree(dir: debugTree.get().asFile, excludes: fileFilter),
        fileTree(dir: kotlinDebugTree.get().asFile, excludes: fileFilter)
    ]))

    executionData.setFrom(fileTree(dir: layout.buildDirectory.get().asFile, includes: [
            "jacoco/testDebugUnitTest.exec",
            "outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec"
    ]))
}

tasks.withType(Test).configureEach {
    jacoco {
        includeNoLocationClasses = true
        excludes = ['jdk.internal.*']
    }
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = 'full'
        showStandardStreams = true
    }
}

